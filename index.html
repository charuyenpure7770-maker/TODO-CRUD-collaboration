<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO CRUD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
   <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body style="background-color: #ededed;">
  <div class="container">
    <div class="row mt-5">
      <div class="col-md-6 ">
            <div class="card shadow">
                <div class="card-header" >
                    <h2 class="text-center"> Todo List</h2>
                </div>
        <div class="card-body">
            
            <form action="" id="form" class="form">
                <div class="form-group">
                    <label for="name"><b>Title:-</b></label>
                    <input type="text" class="form-control" id="title" required>
                </div>
                  <div class="form-group">
                  <label for="description"><b>Add Description:-</b></label>
                  <textarea
                    class="form-control"
                    rows="3"
                    placeholder="Write a something about this task.."
                    id="description"
                  ></textarea>
                </div>
                </div>
               <div class="card-footer">
                   <button type="submit" class="btn btn-primary btn-sm btn-block" id="submit">Add List</button>
                <button type="button" class="btn btn-success btn-sm btn-block d-none" id="update">Update List</button>
               </div>
            </form>
        
       </div>
      </div>
      <div class="col-md-6 ">
        <div class="card shadow">
            <div class="card-body">
                <ul class="list-group" id="list">
                    <!-- <li class="list-group-item">
                        <strong>HTML</strong>
                        <P>HTML is stands for hypertext markeup language. and it is used to create a structure of an web page .</P>
                   
                    <div>
                        <br>
                        <button class="btn btn-warning btn-sm ">Edit</button>
                        <button class="btn btn-success btn-sm ">Delete</button>
                    </div>
                     </li> -->
                </ul>
            </div>
        </div>
      </div>
    </div>
  </div>
  <div class="spinner d-none" id="spinner">
  <div class="spinner-border" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
  <script src="./assets/js/app.js"></script>
</body>
</html>
